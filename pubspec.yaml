name: math_bus
description: "Aplicação desenvolvida para tornar a prática de matemática básica mais simples, acessível e interativa."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  
  go_router: ^17.1.0
  signature: ^6.4.0
  package_info_plus: ^10.2.1

  cupertino_icons: ^1.0.8


dev_dependencies:
  flutter_lints: ^6.0.0

  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/math_bus.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/